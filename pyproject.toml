[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memor-db"
version = "0.2.0"
authors = [
    { name="Memor Contributors" }
]
description = "A local-first, embedded bitemporal memory engine for LLM agents."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "groq>=0.11.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "rank_bm25>=0.2.2",
    "sentence-transformers>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]
mcp = [
    "mcp>=1.1.2",
]

[project.scripts]
memor-server = "memor.mcp_server:main"

[tool.setuptools]
packages = ["memor", "memor.testing"]
[tool.setuptools.package-data]
memor = ["testing/cases.json"]

[project.entry-points.pytest11]
temporal_memory = "memor.testing.plugin"
